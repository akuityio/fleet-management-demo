---
# Source: kargo-enterprise/templates/promotion-request-controller/service-account.yaml
# The PromotionRequest controller's identity. Rendered in the cluster where the controller workload
# runs (used as its pod `serviceAccountName`) and in the cluster hosting the kargo data plane
# (subjected to the data-plane RBAC). In a single-cluster topology both are the same cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kargo-promotion-request-controller
  namespace: kargo
  labels:
    helm.sh/chart: kargo-enterprise-0.1.0
    app.kubernetes.io/name: kargo-enterprise
    app.kubernetes.io/instance: kargo
    app.kubernetes.io/version: "v0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: promotion-request-controller
---
# Source: kargo-enterprise/templates/promotion-request-controller/cluster-roles.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kargo-promotion-request-controller
  labels:
    helm.sh/chart: kargo-enterprise-0.1.0
    app.kubernetes.io/name: kargo-enterprise
    app.kubernetes.io/instance: kargo
    app.kubernetes.io/version: "v0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: promotion-request-controller
rules:
- apiGroups:
    - kargo.akuity.io
  resources:
    - promotionrequests
    - promotionrequests/status
  verbs:
    - get
    - list
    - watch
    - update
    - patch
# Child Promotions are created here and watched for their phase; they are never
# updated in place. Delete is granted so that owned children can be cleaned up.
- apiGroups:
    - kargo.akuity.io
  resources:
    - promotions
  verbs:
    - get
    - list
    - watch
    - create
    - delete
# The "promote" dolphin verb is required, not optional: the Promotion admission
# webhook runs a SubjectAccessReview for it against the Stage named by every
# Promotion being created. Without it, "create" on promotions above is dead
# permission -- every child is rejected at admission.
- apiGroups:
    - kargo.akuity.io
  resources:
    - stages
  verbs:
    - get
    - list
    - watch
    - promote
- apiGroups:
    - kargo.akuity.io
  resources:
    - freights
  verbs:
    - get
    - list
    - watch
# Targets are never resolved here -- spec.targets is a snapshot taken by the
# Stage controller -- but when a child Promotion succeeds, the Freight it
# rendered and the health checks it produced are recorded on its Target's
# status, keyed by Stage.
- apiGroups:
    - kargo.akuity.io
  resources:
    - targets
  verbs:
    - get
    - list
    - watch
- apiGroups:
    - kargo.akuity.io
  resources:
    - targets/status
  verbs:
    - patch
---
# Source: kargo-enterprise/templates/promotion-request-controller/cluster-role-bindings.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kargo-promotion-request-controller
  labels:
    helm.sh/chart: kargo-enterprise-0.1.0
    app.kubernetes.io/name: kargo-enterprise
    app.kubernetes.io/instance: kargo
    app.kubernetes.io/version: "v0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: promotion-request-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kargo-promotion-request-controller
subjects:
  - kind: ServiceAccount
    name: kargo-promotion-request-controller
    namespace: kargo
